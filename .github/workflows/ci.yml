name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace
      - name: Release build
        run: cargo build --release --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the ballistic oracle
        run: pip install py-ballisticcalc==3.1.1
      - name: Compare the solver with py-ballisticcalc
        run: python3 tools/oracle_check.py target/release/holdover-cli
