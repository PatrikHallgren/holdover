[workspace]
resolver = "2"
members = [
    "crates/holdover-core",
    "crates/holdover-cli",
    "crates/holdover-theme",
    "crates/holdover-lan",
    "app/src-tauri",
]

[workspace.package]
version = "1.5.5"
edition = "2021"
license = "MIT"
authors = ["Patrik Hallgren"]
repository = "https://github.com/PatrikHallgren/holdover"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "~4.5.23", features = ["derive"] }
